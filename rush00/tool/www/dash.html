<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rush00 · team select</title>
<link rel="stylesheet" href="/www/notebook.css">
</head>
<body>
<!-- shared drawing bits: hatch fills and the wobble that makes lines look hand-drawn -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="wob" x="-5%" y="-10%" width="110%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  <filter id="dz" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
  <filter id="dy" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="61"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>
  <pattern id="hg" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 4.5 L9 4.5" stroke="#F2C38F" stroke-width="4.5"/></pattern>
  <pattern id="ht" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 4.5 L9 4.5" stroke="#0B7A73" stroke-width="4.5"/></pattern>
  <pattern id="hm" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><path d="M0 4.5 L9 4.5" stroke="#9FD3CC" stroke-width="4.5"/></pattern>
</defs></svg>

<div class="wrap">
<header class="band">
  <div>
    <p class="kicker">LEVEL 0 · TEAM SELECT</p>
    <h1>Rush00</h1>
    <p class="sub" id="subj"></p>
  </div>
  <!-- the player (orange headband), running in, with a controller: decoration only -->
  <svg class="doodle" width="230" height="150" viewBox="-110 -50 230 170" aria-hidden="true">
    <g id="dd">
      <circle cx="0" cy="0" r="18"/><path d="M-18 -5 Q0 -12 18 -5" stroke="#E07A1F" stroke-width="7"/>
      <path d="M-16 -5 Q-34 -14 -48 -6 M-16 -3 Q-30 8 -44 14" stroke="#E07A1F" stroke-width="4"/>
      <path d="M0 18 L-4 70 M-30 110 L-4 70 L24 104 M-26 34 L0 30 L26 44"/>
      <path d="M-62 44 L-46 44 M-66 64 L-50 64 M-74 84 L-58 84" stroke-width="3"/>
      <g transform="translate(62 38) rotate(-12) scale(0.55)">
        <path d="M-50 -10 Q-50 -25 -30 -25 L30 -25 Q50 -25 50 -10 L56 20 Q58 34 44 34 Q34 34 28 20 L-28 20 Q-34 34 -44 34 Q-58 34 -56 20 Z" fill="url(#hm)"/>
        <path d="M-34 -6 L-34 8 M-41 1 L-27 1"/><circle cx="28" cy="-4" r="4"/><circle cx="38" cy="6" r="4"/>
      </g>
      <path d="M86 -30 Q90 -40 94 -30 Q104 -26 94 -22 Q90 -12 86 -22 Q76 -26 86 -30 Z" fill="url(#hg)"/>
    </g>
    <use href="#dd" filter="url(#dy)" transform="translate(5 4)" fill="none" stroke="#1E2A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <use href="#dd" filter="url(#dz)" fill="none" stroke="#1E2A3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span class="sp"></span>
  <div class="hud" id="hud" title="teams whose verdict is a pass"></div>
  <div class="tools"><button class="btn small" id="rerunall" type="button">re-run all</button><button class="btn small themebtn" type="button" title="paper / night page">☾</button></div>
</header>

<main class="stage">
  <div>
    <div class="card player" id="player"><div class="empty">Loading the teams…</div></div>
    <div class="join" id="drop">
      <h3>+ New player</h3>
      <p>Drop team folders anywhere on this page, <label style="text-decoration:underline;cursor:pointer">pick a folder<input id="pick" type="file" webkitdirectory multiple hidden></label>, copy them into <code id="repo"></code>, or clone:</p>
      <form id="gitform"><input name="url" placeholder="git@vogsphere…  /  https://…git" autocomplete="off">
        <input name="leader" placeholder="leader login" autocomplete="off">
        <select name="rush"><option value="">rush ?</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
        <button class="btn small" type="submit">clone</button></form>
    </div>
  </div>
  <aside class="card r2 roster">
    <span class="tape c"></span>
    <div class="head"><span class="h3 marker" style="font-size:28px">Players</span><span class="n" id="count"></span></div>
    <ol id="roster"></ol>
    <div class="keys"><kbd>j</kbd>/<kbd>k</kbd> or <kbd>↑</kbd><kbd>↓</kbd> pick · <kbd>enter</kbd> play · <kbd>r</kbd> report</div>
  </aside>
</main>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({error: r.statusText}));
  if (!r.ok) { const e = new Error(j.error || r.statusText); e.status = r.status; e.body = j; throw e; }
  return j;
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
(function theme() {
  const root = document.documentElement;
  try { if (localStorage.getItem('rush-nb-theme') === 'dark') root.setAttribute('data-theme', 'dark'); } catch (e) {}
  $('.themebtn').onclick = () => {
    const dark = root.getAttribute('data-theme') !== 'dark';
    if (dark) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
    try { localStorage.setItem('rush-nb-theme', dark ? 'dark' : 'light'); } catch (e) {}
  };
})();

let state = null, sel = null, playerHash = null;
const rowHash = {};
const BUSY = ['queued', 'running', 'cloning'];
const HEART = 'M0 14 C-34 -12 -18 -38 0 -18 C18 -38 34 -12 0 14 Z';

// one heart per basic check: full = passed, broken = failed, faded = not known
function heart(kind, label, title) {
  const body = kind === 'full' ? `<path d="${HEART}" fill="#E07A1F"/>`
    : kind === 'broken' ? `<path d="${HEART}"/><path d="M0 -18 L-6 -6 L4 0 L-2 12" stroke="#E07A1F"/>`
    : `<path d="${HEART}" stroke-dasharray="6 6" opacity="0.5"/>`;
  return `<div class="heart ${kind === 'broken' ? 'bad' : ''}" title="${esc(title)}"><svg width="54" height="46" viewBox="-27 -26 54 46">
    <g filter="url(#wob)" fill="none" stroke="#1E2A3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="scale(.75)">${body}</g></svg><span>${label}</span></div>`;
}
function verdictOf(t) {
  const st = t.status, s = t.summary;
  if (BUSY.includes(st)) return {cls: 'na', text: st, busy: true};
  if (st === 'error') return {cls: 'bad', text: 'error'};
  if (st === 'skipped') return {cls: 'na', text: 'not a rush00'};
  if (s) return {cls: s.verdict[0], text: s.verdict[1]};
  return {cls: 'na', text: 'new'};
}
const MARK = {ok: '✓', bad: '✗', warn: '!', na: '–'};
const SAYS = {ok: 'stage clear!', bad: 'game over', warn: 'check it'};

function stageRows(s) {
  return Object.entries(s.rushes).sort((a, b) => a[0] - b[0]).map(([n, r]) => {
    const [p, tot] = r.core, good = p === tot && tot;
    const cls = !r.build ? 'bad' : good ? (r.mode === 'subject' ? 'ok' : 'warn') : 'bad';
    const pct = tot ? Math.round(100 * p / tot) : 0;
    const tag = !r.build ? 'does not build' : cls === 'warn' ? 'matches their own pattern: check it against the PDF' : '';
    return `<div class="stg ${cls}${+n === s.assigned ? ' asg' : ''}" title="${esc(r.mode)}">
      <span class="rn">rush0${n}</span><span class="track"><i style="width:${pct}%"></i></span><span class="sc">${p}/${tot}</span>
      ${tag ? `<span class="tag">${tag}</span>` : ''}</div>`;
  }).join('');
}

function playerCard(t, idx, n) {
  const s = t.summary, v = verdictOf(t), m = t.meta || {};
  let hearts = '', stages = '', draws = '';
  if (s) {
    const norm = s.norm_ok === true ? heart('full', 'norm', 'norminette passes') : s.norm_ok === false ? heart('broken', 'norm', 'norminette errors') : heart('lost', 'norm', 'not checked');
    const forb = s.forbidden.length ? heart('broken', '✗ ' + esc(s.forbidden.join(', ')), 'forbidden functions used') : heart('full', 'write only', 'only write is used');
    const fst = (s.checks.find(c => c[0] === 'Turn-in files') || [, 'na'])[1];
    const files = fst === 'ok' ? heart('full', 'files', 'turn-in files are right') : fst === 'bad' ? heart('broken', 'files', 'turn-in files are wrong') : heart('lost', 'files', 'turn-in files: check');
    hearts = `<div><p class="lab">LIVES</p><div class="hearts">${norm}${forb}${files}</div></div>`;
    stages = `<div class="stages"><p class="lab" style="margin:0">STAGES <span style="font-family:var(--hand);letter-spacing:0">(core cases passed${s.assigned != null ? ', ★ = assigned' : ''})</span></p>${stageRows(s)}</div>`;
    const asg = s.assigned != null ? s.rushes[s.assigned] : Object.values(s.rushes)[0];
    if (asg && asg.theirs) draws = `<div class="draws"><div class="chip3">${asg.theirs.join('').split('').map(c => `<span>${c === ' ' ? '␣' : esc(c)}</span>`).join('')}</div><p class="lab" style="margin:4px 0 0">DRAWS</p></div>`;
  }
  const asgWhy = s && s.assigned != null ? `assigned rush0${s.assigned} · ${esc(s.assigned_why)}` : s ? 'assigned rush unknown: set the stage below' : '';
  const opts = ['', 0, 1, 2, 3, 4].map(x => `<option value="${x}"${String(m.rush ?? '') === String(x) ? ' selected' : ''}>${x === '' ? 'auto' : 'rush0' + x}</option>`).join('');
  const enc = encodeURIComponent(t.name);
  const err = t.error ? `<details class="err"><summary>${t.status === 'skipped' ? esc(t.error) : 'what went wrong'}</summary><pre>${esc(t.error)}</pre></details>` : '';
  return `<span class="tape c"></span>
    <div class="top"><div class="who"><div class="kick">PLAYER ${idx + 1}/${n}</div><h2 class="name">${esc(t.name)}</h2><div class="why">${asgWhy}</div></div>
      <div class="stamp ${v.cls}">${v.busy ? '<span class="spin"></span> ' : ''}${esc(v.text)}${SAYS[v.cls] ? `<small>${SAYS[v.cls]}</small>` : ''}</div></div>
    ${s ? `<div class="row2"><div>${hearts}${stages}</div>${draws}</div>` : ''}${err}
    <div class="fields"><label class="field"><span class="lab">LEADER</span><input data-k="leader" value="${esc(m.leader || '')}" placeholder="login"></label>
      <label class="field"><span class="lab">STAGE</span><select data-k="rush">${opts}</select></label></div>
    <div class="acts">${s ? `<a class="btn go" href="/team/${enc}">▶ Play</a><a class="btn" href="/report/${enc}">Report</a>` : ''}
      <button class="btn" type="button" data-act="rerun">Re-run</button><span class="sp"></span>
      <button class="btn small x" type="button" data-act="remove" title="move to repo/.trash">✕ remove</button></div>`;
}

function rosterRow(t) {
  const v = verdictOf(t), s = t.summary;
  const rs = s && s.assigned != null ? `rush0${s.assigned}` : '';
  return `<span class="mk ${v.cls}">${v.busy ? '<span class="spin"></span>' : MARK[v.cls] || '–'}</span><span class="nm">${esc(t.name)}</span><span class="rs">${rs}</span>`;
}

function select(name, scroll) {
  if (!state || !state.teams.some(t => t.name === name)) return;
  sel = name; playerHash = null;
  history.replaceState(null, '', '#t=' + encodeURIComponent(name));
  try { sessionStorage.setItem('rush-sel', name); } catch (e) {}
  render();
  if (scroll) { const li = $(`#roster [data-team="${CSS.escape(name)}"]`); if (li) li.scrollIntoView({block: 'nearest'}); }
}

function render() {
  if (!state) return;
  $('#repo').textContent = state.repo || '';
  const S = state.subject;
  const nr = Object.keys(S.rushes).length;
  $('#subj').innerHTML = S.loaded ? `subject.txt · ${nr} rush section${nr === 1 ? '' : 's'}` + (S.notes.length ? ` · <span style="color:var(--hl)">${S.notes.length} note(s)</span>` : '')
    : '<u style="color:var(--hl)">no subject.txt</u> · checked against the core only';
  const teams = state.teams, n = teams.length;
  const clear = teams.filter(t => t.summary && t.summary.verdict[0] === 'ok').length;
  $('#hud').innerHTML = `<span class="lv">RUSH 00</span><span class="lbl">CLEAR</span><span class="n">${clear}/${n}</span><span class="bar"><i style="width:${n ? Math.round(100 * clear / n) : 0}%"></i></span>`;
  $('#count').textContent = `${n} team${n === 1 ? '' : 's'}`;

  if (!sel || !teams.some(t => t.name === sel)) {
    let want = decodeURIComponent((location.hash.match(/^#t=(.+)$/) || [])[1] || '');
    if (!want) try { want = sessionStorage.getItem('rush-sel') || ''; } catch (e) {}
    sel = teams.some(t => t.name === want) ? want : (teams[0] && teams[0].name);
  }
  // roster
  const box = $('#roster'), seen = new Set();
  teams.forEach((t, i) => {
    seen.add(t.name);
    let li = box.querySelector(`[data-team="${CSS.escape(t.name)}"]`);
    if (!li) { li = document.createElement('li'); li.dataset.team = t.name; box.appendChild(li); }
    if (box.children[i] !== li) box.insertBefore(li, box.children[i]);
    li.classList.toggle('on', t.name === sel);
    const h = JSON.stringify([t.status, t.summary && t.summary.verdict, t.summary && t.summary.assigned]);
    if (rowHash[t.name] !== h) { rowHash[t.name] = h; li.innerHTML = rosterRow(t); }
  });
  [...box.children].forEach(li => { if (!seen.has(li.dataset.team)) { li.remove(); delete rowHash[li.dataset.team]; } });
  // the focused player (left alone while you type in it)
  const pc = $('#player');
  if (!n) { pc.innerHTML = '<span class="tape c"></span><h2 class="name" style="font:400 40px var(--marker);margin:0">No players yet</h2><p class="empty">Drop a team folder on the page to start.</p>'; playerHash = null; return; }
  const i = teams.findIndex(t => t.name === sel), t = teams[i];
  const h = JSON.stringify([t, i, n]);
  if (h === playerHash || pc.contains(document.activeElement) && document.activeElement.matches('input,select')) return;
  playerHash = h; pc.dataset.team = t.name; pc.innerHTML = playerCard(t, i, n);
}
async function refresh() {
  try { state = await api('/api/state'); render(); } catch (e) { /* server restarting */ }
}
setInterval(refresh, 1500); refresh();

$('#roster').addEventListener('click', e => { const li = e.target.closest('li'); if (li) select(li.dataset.team); });
document.addEventListener('keydown', e => {
  if (!state || e.target.matches('input,select,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  const names = state.teams.map(t => t.name), i = names.indexOf(sel);
  if (['j', 'ArrowDown'].includes(e.key)) { e.preventDefault(); select(names[Math.min(names.length - 1, i + 1)], true); }
  else if (['k', 'ArrowUp'].includes(e.key)) { e.preventDefault(); select(names[Math.max(0, i - 1)], true); }
  else if (e.key === 'Enter' && sel) { const a = $('#player .btn.go'); if (a) location.href = a.href; }
  else if (e.key === 'r' && sel) { location.href = '/report/' + encodeURIComponent(sel); }
});
$('#player').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const team = $('#player').dataset.team;
  if (b.dataset.act === 'rerun') await api('/api/rerun', {team});
  if (b.dataset.act === 'remove' && confirm(`Move ${team} to repo/.trash?`)) await api('/api/remove', {team});
  playerHash = null; refresh();
});
$('#player').addEventListener('change', async e => {
  const inp = e.target.closest('[data-k]'); if (!inp) return;
  const team = $('#player').dataset.team;
  try { await api('/api/meta', {team, [inp.dataset.k]: inp.value}); toast(`${team}: saved, re-running`); }
  catch (err) { toast(err.message); }
  inp.blur(); playerHash = null; refresh();
});
$('#rerunall').onclick = async () => { await api('/api/rerun', {all: true}); refresh(); };
$('#gitform').onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    const r = await api('/api/add', {url: f.get('url'), leader: f.get('leader') || undefined, rush: f.get('rush') || undefined});
    toast(`cloning ${r.team}…`); e.target.reset(); refresh();
  } catch (err) { toast(err.message); }
};
// ---- dropping folders --------------------------------------------------
const SKIP = new Set(['node_modules', '.DS_Store']);
const MAX_BYTES = 40 * 1024 * 1024;
function b64(buf) {
  let s = ''; const a = new Uint8Array(buf);
  for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000));
  return btoa(s);
}
async function readAll(dirEntry) {
  const reader = dirEntry.createReader(), out = [];
  for (;;) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    if (!batch.length) return out;
    out.push(...batch);
  }
}
async function walk(entry, prefix, acc) {
  if (SKIP.has(entry.name)) return;
  if (entry.isFile) acc.push({path: prefix + entry.name, file: await new Promise((res, rej) => entry.file(res, rej))});
  else for (const e of await readAll(entry)) await walk(e, prefix + entry.name + '/', acc);
}
function teamName(dirName) {
  if (/^ex\d+$/i.test(dirName)) return [prompt(`"${dirName}" looks like the exercise folder itself. Team name?`) || '', dirName + '/'];
  return [dirName, ''];
}
async function upload(team, files, keepPrefix) {
  team = (team || '').trim(); if (!team) return;
  let total = 0; for (const f of files) total += f.file.size;
  if (total > MAX_BYTES) { toast(`${team}: ${(total / 1e6).toFixed(1)} MB is too big`); return; }
  const payload = [];
  for (const f of files) payload.push({path: keepPrefix + f.path, b64: b64(await f.file.arrayBuffer())});
  try { await api('/api/upload', {team, files: payload}); }
  catch (e) {
    if (e.status === 409 && confirm(`${team} already exists. Replace it? (the old copy goes to repo/.trash)`)) await api('/api/upload', {team, files: payload, replace: true});
    else if (e.status !== 409) { toast(e.message); return; }
    else return;
  }
  toast(`${team}: ${files.length} file(s) added`); refresh();
}
const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { if (ev === 'drop' || !e.relatedTarget) drop.classList.remove('over'); }));
document.addEventListener('drop', async e => {
  e.preventDefault();
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const loose = [];
  for (const en of entries) {
    if (en.isDirectory) {
      const acc = []; for (const c of await readAll(en)) await walk(c, '', acc);
      const [name, pre] = teamName(en.name); await upload(name, acc, pre);
    } else loose.push({path: en.name, file: await new Promise(r => en.file(r))});
  }
  if (loose.length) { const name = prompt('Team name for these files? (they go into <team>/ex00/)'); if (name) await upload(name, loose, 'ex00/'); }
});
$('#pick').onchange = async e => {
  const groups = {};
  for (const f of e.target.files) {
    const parts = f.webkitRelativePath.split('/');
    if (parts.some(p => SKIP.has(p))) continue;
    (groups[parts[0]] ||= []).push({path: parts.slice(1).join('/'), file: f});
  }
  for (const [dir, files] of Object.entries(groups)) { const [name, pre] = teamName(dir); await upload(name, files, pre); }
  e.target.value = '';
};
</script>
</body></html>
