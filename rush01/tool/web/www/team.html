<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rush01 · team</title>
<link rel="stylesheet" href="/www/notebook.css">
<link rel="stylesheet" href="/www/rush01.css">
<link rel="stylesheet" href="/www/game.css">
</head>
<body>
<!-- shared drawing bits (from rush00's dash.html): the wobble that makes lines look hand-drawn -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="wob" x="-5%" y="-10%" width="110%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
</defs></svg>

<div class="wrap">
<header class="band slim">
  <div>
    <p class="kicker">RUSH 01 · TEAM</p>
    <h1 id="name">…</h1>
    <p class="sub" id="sub"></p>
  </div>
  <span class="sp"></span>
  <div class="hud" id="hud" title="bank runs that pass"></div>
  <div class="tools"><a class="btn small" href="/">&#8592; dashboard</a><a class="btn small" href="/library">library</a><button class="btn small" id="rerun" type="button">re-run</button><button class="btn small themebtn" type="button" title="paper / night page">&#9790;</button></div>
</header>

<p class="banner" id="banner" hidden></p>

<main id="main">
  <section id="gatebox" hidden>
    <ol class="gates" id="gates" aria-label="the eval sheet, in its order"></ol>
    <p class="gates-note" id="gates-note"></p>
  </section>
  <div class="hero" id="hero" hidden>
    <section id="sky" class="card"><span class="tape c"></span><h3>Their output, in 3D</h3><div id="skybox"></div></section>
    <aside id="loadout" class="card r2 loadout"></aside>
  </div>
  <nav class="deck-tabs" id="deck-tabs" hidden>
    <button class="tab" type="button" data-deck="defense">Defense</button>
    <button class="tab" type="button" data-deck="runs">Runs</button>
    <button class="tab" type="button" data-deck="source">Source</button>
    <button class="tab" type="button" data-deck="all">All</button>
    <span class="sp"></span><span class="keys"><kbd>1</kbd>–<kbd>4</kbd> switch · <i>All</i> for Ctrl+F</span>
  </nav>
  <div class="deck" id="deck">
    <section id="sheet" class="card r2" data-panel="defense" hidden></section>
    <section id="parts" class="parts" data-panel="defense" hidden></section>
    <section id="strip" class="card r1" data-panel="defense" hidden></section>
    <section id="runs" class="card r2" data-panel="runs" hidden></section>
    <section id="source" class="card" data-panel="source" hidden></section>
  </div>
</main>
</div>
<script src="/www/page.js"></script>
<script src="/www/sky3d.js"></script>
<script src="/www/demos_gen.js"></script>
<script src="/www/demos_ui.js"></script>
<script src="/www/team.js"></script>
</body></html>
